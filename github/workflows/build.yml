name: Compilar projeto Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: unzip SURF_HACK_Android_Project.zip -d projeto

      - name: Compilar APK
        run: |
          cd projeto
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: SURF-HACK-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
